      const fresh = document.getElementById('ex-' + ex.id);
      bindCardInputs(fresh);
    }

    function finishGrade(ex, card, score) {
      const total = exTotal(ex);
      saveResult(ex.id, score, total);
      const extra = card.querySelector('[data-result]').dataset.extra || '';
      showScore(card, score, total, extra);
      const checkBtn = card.querySelector('[data-act="check"]');
      if (checkBtn) checkBtn.disabled = true;
    }

    // Live input helpers (Enter to jump between blanks, word counts)
    function bindCardInputs(root) {
      root.querySelectorAll('.blank').forEach((inp, idx, all) => {
        inp.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const next = all[idx + 1];
          if (next) next.focus();
          else inp.closest('[data-ex]').querySelector('[data-act="check"]')?.click();
        });
      });
      root.querySelectorAll('.ex-card textarea.field[data-field], .ex-card input.field[data-field]').forEach(f => {
        f.addEventListener('input', () => {
          f.closest('.q-item')?.classList.remove('need');
          const meta = f.closest('.q-item')?.querySelector('[data-meta]');
          if (meta) meta.innerHTML = openMetaHtml(f.closest('[data-ex]').dataset.ex, Number(f.dataset.field), f.value);
        });
      });
      root.querySelectorAll('.match-row select, .range-row select').forEach(s => {
        s.addEventListener('change', () => s.closest('.match-row, .range-row').classList.remove('need'));
      });
    }

    function findTransitions(text) {
      const lower = norm(text);
      return TRANSITIONS.filter(t => new RegExp('(^|[^a-z])' + escapeRe(t) + '([^a-z]|$)').test(lower));
    }

    function openMetaHtml(exId, i, text) {
      const ex = exIndex.get(exId);
      if (!ex || ex.kind !== 'open') return '';
      const it = ex.items[i];
      const words = countWords(text);
      let html = `<span>${words} คำ${it.minWords ? ` / แนะนำ ≥ ${it.minWords}` : ''}</span>`;
      if (it.highlightTransitions) {
        const found = findTransitions(text);
        html += `<span>Transitions: ${found.length ? found.map(t => `<b style="color: var(--teal)">${esc(t)}</b>`).join(', ') : '—'}</span>`;
      }
      return html;
    }

    // ==========================================================
    // CLICK DELEGATION
    // ==========================================================
    const ACTIONS = {
      choose(el, ex, card) {
        const i = Number(el.dataset.i);
        const j = Number(el.dataset.j);
        const st = getState(ex);
        if (st.answers[i] !== undefined) return;
        const it = ex.items[i];
        const kind = KINDS[ex.kind];
        const ansIdx = kind.answerIndex(ex, it);
        const ok = j === ansIdx;
        st.answers[i] = j;
        const item = card.querySelector(`.q-item[data-i="${i}"]`);
        item.classList.remove('need');
        item.querySelectorAll('.opt').forEach((b, k) => {
          b.disabled = true;
          if (k === ansIdx) b.classList.add('is-correct');
          if (k === j && !ok) b.classList.add('is-wrong');
        });
        item.insertAdjacentHTML('beforeend', itemFeedback(ok, (ok ? '' : `คำตอบคือ <b>${esc(kind.optionLabel(ex, it, ansIdx))}</b>. `) + (it.explain || '')));
        if (Object.keys(st.answers).length === ex.items.length) {
          const score = ex.items.reduce((n, item2, k) => n + (st.answers[k] === kind.answerIndex(ex, item2) ? 1 : 0), 0);
          finishGrade(ex, card, score);
        }
      },

      check(el, ex, card) {
        const kind = KINDS[ex.kind];
        const score = kind.check(ex, card);
        if (score === null || score === undefined) return;
        getState(ex).score = score;
        finishGrade(ex, card, score);
      },

      reset(el, ex, card) { resetExercise(ex, card); },

      override(el, ex, card) {
        const st = getState(ex);
        st.score = (st.score || 0) + 1;
        el.closest('.row-actions').innerHTML = '<span class="chip" style="background: var(--success-light); color: var(--success);">✓ นับเป็นคำตอบที่ถูกแล้ว</span>';
        const field = card.querySelector(`[data-field="${el.dataset.i}"]`);
        if (field) { field.classList.remove('bad'); field.classList.add('ok'); }
        finishGrade(ex, card, st.score);
      },

      'order-pick'(el, ex, card) {
        const st = getState(ex);
        if (st.locked) return;
        const gi = Number(el.dataset.g);
        st.order[gi] = st.order[gi] || [];
        st.order[gi].push(Number(el.dataset.s));
        card.querySelector(`.order-group[data-g="${gi}"]`).innerHTML = orderGroupHtml(ex, gi, st.order[gi]);
      },

      'order-unpick'(el, ex, card) {
        const st = getState(ex);
        if (st.locked) return;
        const gi = Number(el.dataset.g);
        st.order[gi].splice(Number(el.dataset.pos), 1);
        card.querySelector(`.order-group[data-g="${gi}"]`).innerHTML = orderGroupHtml(ex, gi, st.order[gi]);
      },

      'ro-pick'(el, ex, card) {
        const st = getState(ex);
        if (st.locked) return;
        const i = Number(el.dataset.i);
        st.ro[i] = el.dataset.v;
        card.querySelectorAll(`[data-act="ro-pick"][data-i="${i}"]`).forEach(b => b.classList.toggle('picked', b === el));
        const field = card.querySelector(`[data-field="${i}"]`);
        field.hidden = el.dataset.v !== 'RO';
        if (!field.hidden) field.focus();
        card.querySelector(`.q-item[data-i="${i}"]`).classList.remove('need');
      },

      hunt(el, ex) {
        if (getState(ex).locked) return;
        el.classList.toggle('sel');
      },

      reveal(el, ex, card) {
        const i = Number(el.dataset.i);
        const it = ex.items[i];
        const field = card.querySelector(`[data-field="${i}"]`);
        const text = field.value.trim();
        if (!text) {
          toast('ลองเขียนคำตอบก่อน แล้วค่อยดูตัวอย่างนะ ✍️');
          field.focus();
          return;
        }
        const warnings = [];
        if (it.fragment) {
          if (!normLoose(text).includes(normLoose(it.fragment))) warnings.push('ประโยคของคุณไม่ได้ใช้ข้อความ fragment เดิม');
          if (countWords(text) <= countWords(it.fragment) + 2) warnings.push('ดูเหมือนยังขาด main clause (ประธาน + กริยาหลัก)');
        }
        if (it.oneSentence && (text.match(/[.!?](\s|$)/g) || []).length > 1) warnings.push('ยังเป็นมากกว่า 1 ประโยค ลองรวมด้วย conjunction / -ing phrase');
        if (it.minWords && countWords(text) < it.minWords) warnings.push(`ยังสั้นไป (${countWords(text)} คำ) ลองเขียนให้ได้อย่างน้อย ${it.minWords} คำ`);
        if (it.highlightTransitions && findTransitions(text).length < 3) warnings.push('ลองเพิ่ม transition words ให้ได้อย่างน้อย 3 คำ');

    // ==========================================================
    // GLOSSARY POPOVER IN PASSAGES
    // ==========================================================
    function glossaryRegex(unit) {
      const entries = unit.glossary.flatMap(g => [g.word, ...(g.alts || [])]);
      const parts = entries.sort((a, b) => b.length - a.length).map(wordFormsPattern);
      return new RegExp('\\b(' + parts.join('|') + ')\\b', 'gi');
    }

    function findGlossEntry(unit, text) {
      const t = text.toLowerCase();
      return unit.glossary.find(g => [g.word, ...(g.alts || [])].some(w => new RegExp('^' + wordFormsPattern(w) + '$', 'i').test(t)));
    }

    function linkGlossary(root, unit) {
      const re = glossaryRegex(unit);
      root.querySelectorAll('.passage[data-glossary="1"] .para p').forEach(p => {
        const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => {
          const text = node.nodeValue;
          re.lastIndex = 0;
          if (!re.test(text)) return;
          re.lastIndex = 0;
          const frag = document.createDocumentFragment();
          let last = 0;
          text.replace(re, (m, _g, offset) => {
            frag.appendChild(document.createTextNode(text.slice(last, offset)));
            const btn = document.createElement('button');
            btn.className = 'gl-word';
            btn.dataset.act = 'gloss';
            btn.dataset.unit = unit.id;
            btn.textContent = m;
            frag.appendChild(btn);
            last = offset + m.length;
            return m;
          });
          frag.appendChild(document.createTextNode(text.slice(last)));
          node.parentNode.replaceChild(frag, node);
        });
      });
    }

    let glossPop = null;

    function openGlossPop(el) {
      closeGlossPop();
      const unit = WB.units.find(u => u.id === el.dataset.unit);

      glossPop = document.createElement('div');
      glossPop.className = 'gloss-pop';
      glossPop.innerHTML = `
        <div class="gp-word">${esc(entry.word)} <button class="speak-btn" data-act="speak-text" data-text="${esc(entry.word)}" aria-label="ฟังเสียง">🔊</button></div>

      const r = el.getBoundingClientRect();
      const popW = glossPop.offsetWidth;
      const left = Math.min(Math.max(12, r.left + window.scrollX + r.width / 2 - popW / 2), window.scrollX + document.documentElement.clientWidth - popW - 12);
      glossPop.style.left = left + 'px';

    }

    // ==========================================================
    // COMPOSER ANALYSIS
    // ==========================================================
    const PRESENT_VERBS = ['am', 'is', 'are', 'go', 'goes', 'feel', 'feels', 'see', 'sees', 'run', 'runs', 'walk', 'walks', 'say', 'says', 'think', 'thinks', 'want', 'wants', 'know', 'knows', 'come', 'comes', 'get', 'gets', 'look', 'looks', 'start', 'starts', 'decide', 'decides', 'realize', 'realizes', 'hear', 'hears'];
    const SUBORDINATORS = /^(when|while|as|because|after|before|if|although|though|since|by the time|once|until|whenever|even though|as soon as)\b/i;

    function analyzeNarrative(text, min, max) {
      const words = countWords(text);
      const sentences = (text.match(/[^.!?]+[.!?]+["”']?/g) || []).map(s => s.trim()).filter(Boolean);
      const transitions = findTransitions(text);
      const hints = [];

      // Strip quoted speech before tense / POV checks
      const unquoted = text.replace(/[“"][^”"]*[”"]/g, ' ');
      const lower = ' ' + unquoted.toLowerCase().replace(/[^a-z'\s]/g, ' ') + ' ';

      const presentFound = PRESENT_VERBS.filter(v => lower.includes(' ' + v + ' '));
      if (presentFound.length) hints.push({ msg: `อาจมี present tense ปนอยู่: <q>${presentFound.slice(0, 6).join(', ')}</q> — ถ้าไม่ใช่การสะท้อนปัจจุบัน ให้เปลี่ยนเป็น past tense` });
      if (/\byou(r)?\b/.test(lower)) hints.push({ msg: 'พบคำว่า <q>you / your</q> — ระวังการเปลี่ยน point of view' });

      sentences.forEach(s => {
        // ", I lost my phone" after a full clause; short openers like "Last summer, I…" are fine
        const spliceRe = /,\s+(i|he|she|we|they|it|my|his|her|our|their|everyone|nobody)\s+[a-z]+/gi;
        let m;
        while (!SUBORDINATORS.test(s) && (m = spliceRe.exec(s))) {
          if (countWords(s.slice(0, m.index)) > 4) {
            hints.push({ msg: `อาจเป็น comma splice: <q>${esc(s.length > 90 ? s.slice(0, 88) + '…' : s)}</q>` });
            break;
          }
        }
        if (SUBORDINATORS.test(s) && !s.includes(',') && countWords(s) < 9) {
          hints.push({ msg: `อาจเป็น fragment: <q>${esc(s)}</q>` });
        }
        if (countWords(s) > 40) hints.push({ msg: `ประโยคยาวมาก (${countWords(s)} คำ) อาจเป็น run-on: <q>${esc(s.slice(0, 80))}…</q>` });
      });

      if (words && transitions.length < 4) hints.push({ msg: 'ลองเพิ่ม transition words ให้หลากหลายขึ้น (อย่างน้อย 4–5 คำ)' });
      if (words >= min && words <= max && !hints.length) hints.push({ msg: 'ยอดเยี่ยม! ความยาวพอดีและไม่พบจุดที่น่าสงสัย ✨', good: true });

      return { words, sentences: sentences.length, transitions, hints, inRange: words >= min && words <= max };
    }

    function updateComposer(box) {
      const id = box.dataset.comp;
      const block = findBlock(id);
      const text = box.querySelector('textarea').value;
      const a = analyzeNarrative(text, block.min, block.max);
      box.querySelector('[data-stats]').innerHTML = `
        <div class="comp-stat ${a.inRange ? 'in-range' : a.words ? 'out-range' : ''}"><b>${a.words}</b><span>คำ (เป้าหมาย ${block.min}–${block.max})</span></div>

        <div class="comp-stat"><b>${a.transitions.length}</b><span>transition words</span></div>
        <div class="comp-stat"><b>${a.sentences ? Math.round(a.words / a.sentences) : 0}</b><span>คำ/ประโยค เฉลี่ย</span></div>
        ${a.transitions.length ? `<div style="grid-column: 1 / -1;" class="trans-chips">${a.transitions.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}`;
      box.querySelector('[data-hints]').innerHTML = text.trim()
        ? a.hints.map(h => `<li class="${h.good ? 'good' : ''}">${h.good ? '' : '⚠️ '}${h.msg}</li>`).join('')
        : '<li class="good">เริ่มเขียนได้เลย ระบบจะช่วยตรวจระหว่างพิมพ์</li>';
    }

    function findBlock(id) {

            <span class="ex-status">${statusChipHtml(quizId)}</span>
            <h3>ทดสอบคำศัพท์ Unit ${unit.number}</h3>
          </header>
          <p class="ex-inst">เลือกรูปแบบ แล้วตอบให้ได้มากที่สุด (สุ่ม 10 ข้อ)</p>
          <div class="row-actions">
            <button class="btn btn-primary" data-act="quiz-start" data-unit="${unit.id}" data-mode="th">🇹🇭 ความหมาย → คำศัพท์</button>
            <button class="btn" data-act="quiz-start" data-unit="${unit.id}" data-mode="def">📘 นิยามอังกฤษ → คำศัพท์</button>
            <button class="btn" data-act="quiz-start" data-unit="${unit.id}" data-mode="gap">✏️ เติมคำในประโยค</button>
          </div>
          <div data-quiz></div>
        </section>
        <div class="gl-toolbar">
          <div class="gl-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="glSearch" type="search" placeholder="ค้นหาคำศัพท์ ความหมาย..." autocomplete="off">
          </div>
          <div class="seg" role="tablist">
            <button class="${glossaryFilter === 'all' ? 'active' : ''}" data-act="gl-filter" data-v="all">ทั้งหมด</button>
            <button class="${glossaryFilter === 'todo' ? 'active' : ''}" data-act="gl-filter" data-v="todo">ยังไม่จำ</button>
            <button class="${glossaryFilter === 'known' ? 'active' : ''}" data-act="gl-filter" data-v="known">จำได้แล้ว</button>
          </div>
          <span class="chip" id="glCount"></span>
        </div>
        <div class="gl-grid" id="glGrid">
          ${unit.glossary.map(g => {
            const key = unit.id + ':' + g.word;
            const on = !!knownWords[key];
            return `
              <article class="card gl-card ${on ? 'known' : ''}" data-search="${esc((g.word + ' ' + g.th + ' ' + g.en).toLowerCase())}" data-key="${esc(key)}">
                <div class="gl-top">
                  <div><div class="gl-word-big">${esc(g.word)}</div><div class="gl-pos">${esc(g.pos)}</div></div>
                  <div class="gl-actions">
                    <button class="speak-btn" data-act="speak-text" data-text="${esc(g.word)}" aria-label="ฟังเสียง ${esc(g.word)}">🔊</button>
                  </div>
                </div>
                <div class="gl-th">${esc(g.th)}</div>
                <div class="gl-en">${esc(g.en)}</div>
                <div class="gl-ex">${highlightInExample(g)} <button class="speak-btn" style="display: inline-grid; width: 24px; height: 24px; font-size: 0.65rem; vertical-align: middle;" data-act="speak-text" data-text="${esc(g.example)}" aria-label="ฟังประโยค">🔊</button></div>
                <div><button class="known-btn ${on ? 'on' : ''}" data-act="known" data-word="${esc(key)}">${on ? '★ จำได้แล้ว' : '☆ จำได้'}</button></div>
              </article>`;
          }).join('')}
        </div>`;
    }

    function filterGlossary() {
      const q = (document.getElementById('glSearch')?.value || '').toLowerCase().trim();
      document.querySelectorAll('.gl-card').forEach(card => {
        const known = !!knownWords[card.dataset.key];
        const matchFilter = glossaryFilter === 'all' || (glossaryFilter === 'known' ? known : !known);
        card.hidden = !(matchFilter && (!q || card.dataset.search.includes(q)));
      });
      updateGlossaryCount();
    }

    function updateGlossaryCount() {
      const cards = [...document.querySelectorAll('.gl-card')];
      const known = cards.filter(c => knownWords[c.dataset.key]).length;
      const el = document.getElementById('glCount');
      if (el) el.textContent = `★ จำได้ ${known}/${cards.length}`;
    }

    let quiz = null;

    function startGlossQuiz(unitId, mode) {
      const unit = WB.units.find(u => u.id === unitId);
      const pool = [...unit.glossary].sort(() => Math.random() - 0.5).slice(0, 10);
      quiz = { unit, mode, pool, idx: 0, score: 0, answered: false };
      renderGlossQuizStep();
    }

    function renderGlossQuizStep() {
      const host = document.querySelector('[data-quiz]');
      const { unit, mode, pool, idx } = quiz;
      const entry = pool[idx];
      quiz.answered = false;
      let prompt;
      if (mode === 'th') prompt = `<div class="quiz-prompt">${esc(entry.th)}</div><div class="muted">${esc(entry.pos)}</div>`;
      else if (mode === 'def') prompt = `<div class="quiz-prompt en">“${esc(entry.en)}”</div><div class="muted">${esc(entry.pos)}</div>`;
      else {
        const re = new RegExp('\\b(' + [entry.word, ...(entry.alts || [])].map(wordFormsPattern).join('|') + ')\\b', 'gi');
        prompt = `<div class="quiz-prompt en">${esc(entry.example).replace(re, '<b style="color: var(--primary)">_______</b>')}</div><div class="muted">${esc(entry.th)} · ${esc(entry.pos)}</div>`;
      }
      let answerUi;
      if (mode === 'gap') {
        answerUi = `<div class="quiz-type"><input class="field" id="quizInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำศัพท์ (รูปพื้นฐาน)..."><button class="btn btn-primary" data-act="quiz-type-check">ตรวจ</button></div>`;
      } else {
        const others = unit.glossary.filter(g => g !== entry).sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [entry, ...others].sort(() => Math.random() - 0.5);
        answerUi = `<div class="quiz-opts">${options.map(o => `<button class="opt" data-act="quiz-answer" data-word="${esc(o.word)}">${esc(o.word)}</button>`).join('')}</div>`;
      }
      host.innerHTML = `
        <div class="quiz-card card" style="margin-top: 14px;">
          <div class="quiz-meta"><span>ข้อ ${idx + 1} / ${pool.length}</span><span>คะแนน ${quiz.score}</span></div>
          <div class="bar"><span style="width: ${((idx + 1) / pool.length) * 100}%"></span></div>
          ${prompt}
          ${answerUi}
          <div class="quiz-feedback" id="quizFb"></div>
          <div class="row-actions" style="justify-content: center;"><button class="btn btn-sm" data-act="quiz-close">ออกจากควิซ</button></div>
        </div>`;
      const input = document.getElementById('quizInput');
      if (input) {
        input.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          if (quiz.answered) nextGlossQuiz(); else answerGlossQuizTyped();
        });
        if (window.innerWidth > 720) input.focus();
      }
    }

    function showQuizFeedback(ok, entry) {
      quiz.answered = true;
      if (ok) quiz.score++;
      const fb = document.getElementById('quizFb');
      fb.innerHTML = `<span style="color: var(--${ok ? 'success' : 'danger'})">${ok ? '🎉 ถูกต้อง!' : '❌ คำตอบคือ'} <b style="font-family: var(--font-display);">${esc(entry.word)}</b></span> — ${esc(entry.th)}
        <div class="row-actions" style="justify-content: center;"><button class="btn btn-primary btn-sm" data-act="quiz-next">${quiz.idx + 1 < quiz.pool.length ? 'ข้อถัดไป →' : 'ดูผลคะแนน'}</button></div>`;
      speak(entry.word);
    }

    function answerGlossQuiz(el) {
      if (quiz.answered) return;
      const entry = quiz.pool[quiz.idx];
      const ok = el.dataset.word === entry.word;
      el.parentElement.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.word === entry.word) b.classList.add('is-correct');
        else if (b === el) b.classList.add('is-wrong');
      });
      showQuizFeedback(ok, entry);
    }

    function answerGlossQuizTyped() {
      if (quiz.answered) return;
      const input = document.getElementById('quizInput');
      if (!input.value.trim()) { toast('พิมพ์คำตอบก่อนนะ'); return; }
      const entry = quiz.pool[quiz.idx];
      const val = norm(input.value);
      const ok = [entry.word, ...(entry.alts || [])].some(w => new RegExp('^' + wordFormsPattern(w) + '$').test(val));
      input.disabled = true;
      input.classList.add(ok ? 'ok' : 'bad');
      showQuizFeedback(ok, entry);
    }

    function nextGlossQuiz() {
      quiz.idx++;
      if (quiz.idx < quiz.pool.length) {
        renderGlossQuizStep();
        return;
      }
      const id = `${quiz.unit.id}-g-quiz`;
      saveResult(id, quiz.score, quiz.pool.length);
      const host = document.querySelector('[data-quiz]');
      const pct = Math.round((quiz.score / quiz.pool.length) * 100);
      host.innerHTML = `
        <div class="score-banner ${percentClass(pct)}" style="margin-top: 14px;">
          <span class="big">${quiz.score}/${quiz.pool.length}</span>
          <span>${pct >= 80 ? 'เยี่ยมมาก! คำศัพท์บทนี้แน่นแล้ว 🏆' : pct >= 50 ? 'ดีแล้ว ทบทวนคำที่พลาดอีกนิด 💪' : 'ลองทบทวนการ์ดคำศัพท์ด้านล่างแล้วเล่นใหม่นะ 📚'}</span>
        </div>`;
      document.querySelector('[data-quiz-host] .ex-status').innerHTML = statusChipHtml(id);
      quiz = null;
    }

    function closeGlossQuiz() {
      quiz = null;
      document.querySelector('[data-quiz]').innerHTML = '';
    }

    // ==========================================================
    // PAGES
    // ==========================================================
    function renderHome() {
      const totalEx = WB.units.reduce((n, u) => n + SECTION_ORDER.reduce((m, k) => m + sectionExerciseIds(u, k).length, 0), 0);
      const doneEx = WB.units.reduce((n, u) => n + SECTION_ORDER.reduce((m, k) => m + sectionExerciseIds(u, k).filter(id => progress[id]).length, 0), 0);
      const totalWords = WB.units.reduce((n, u) => n + u.glossary.length, 0);
      document.getElementById('app').innerHTML = `
        <section class="hero">
          <div class="hero-eyebrow">5500111 Experiential English 1</div>
          <h1>Workbook<br>Unit 3 – 4</h1>
          <p>แบบฝึกหัดครบทุกพาร์ตจากหนังสือ — Reading, Language Focus, Writing, Glossary และ Communication ตรวจคำตอบทันทีพร้อมคำอธิบายภาษาไทย</p>
          <div class="hero-stats">
            <span class="hero-stat"><b>${doneEx}/${totalEx}</b>แบบฝึกที่ทำแล้ว</span>
            <span class="hero-stat"><b>${totalWords}</b>คำศัพท์</span>
            <span class="hero-stat"><b>6</b>บทอ่าน</span>
          </div>
        </section>
        <div class="unit-grid">
          ${WB.units.map(u => `
            <a class="card unit-card" href="#${u.id}/reading">
              <div class="unit-card-head">
                <span class="unit-emoji">${u.emoji}</span>
                <div>
                  <div class="unit-num">Unit ${u.number} · ${esc(u.pages)}</div>
                  <div class="unit-title">${esc(u.title)}</div>
                  <div class="unit-th">${esc(u.titleTh)}</div>
                </div>
              </div>
              <div class="sec-bars">
                ${SECTION_ORDER.map(k => {
                  const pct = sectionPct(u, k);
                  return `<div><div class="sec-bar-label"><span>${SECTION_META[k].icon} ${SECTION_META[k].label}</span><span class="sec-pct">${pct}%</span></div><div class="bar"><span style="width: ${pct}%"></span></div></div>`;
                }).join('')}
              </div>
              <span class="btn btn-primary">${unitPct(u) ? 'เรียนต่อ' : 'เริ่มเรียน'} →</span>
            </a>`).join('')}
        </div>
        <div class="card home-foot">
          <span>💾 ความคืบหน้าบันทึกไว้ในเบราว์เซอร์นี้ · 🔊 แตะปุ่มลำโพงเพื่อฟังเสียงอ่าน · 📖 แตะคำที่ขีดเส้นประในบทอ่านเพื่อดูความหมาย</span>
          <button class="btn btn-sm" data-act="reset-progress">ล้างความคืบหน้า</button>
        </div>`;
    }

    function renderUnit(unit, sec) {
      const blocks = sec === 'glossary' ? null : unit.sections[sec] || [];
      const exBlocks = blocks ? blocks.filter(b => b.type === 'exercise') : [];
      const toc = exBlocks.length ? `
        <nav class="card toc" aria-label="แบบฝึกในพาร์ตนี้">
          <div class="toc-title"><span>แบบฝึกในพาร์ตนี้ (${exBlocks.length})</span><span>${sectionPct(unit, sec)}% เสร็จแล้ว</span></div>
          <div class="toc-list">${exBlocks.map(b => `<a class="toc-item ${progress[b.id] ? 'done' : ''}" data-target="${b.id}" href="#${unit.id}/${sec}" onclick="event.preventDefault(); document.getElementById('ex-${b.id}').scrollIntoView({ behavior: 'smooth' });"><span class="dot"></span>${esc(b.title.replace(/ — .*/, ''))}</a>`).join('')}</div>
        </nav>` : '';

      document.getElementById('app').innerHTML = `
        <section class="unit-banner ${unit.id}">
          <span class="unit-emoji">${unit.emoji}</span>
          <div>
            <div class="unit-num">Unit ${unit.number} · ${esc(unit.pages)}</div>
            <h1>${esc(unit.title)}</h1>
            <p>${esc(unit.titleTh)}</p>
          </div>
        </section>
        <nav class="sec-tabs" aria-label="พาร์ตของบทเรียน">
          ${SECTION_ORDER.map(k => {
            const pct = sectionPct(unit, k);
            return `<a class="sec-tab ${k === sec ? 'active' : ''}" href="#${unit.id}/${k}" data-sec="${k}" data-unit="${unit.id}">${SECTION_META[k].icon} ${SECTION_META[k].label} <span class="tab-pct ${pct === 100 ? 'done' : ''}">${pct}%</span></a>`;
          }).join('')}
        </nav>
        <div class="sec-body">
          ${sec === 'glossary' ? renderGlossary(unit) : toc + blocks.map(b => (BLOCKS[b.type] || (() => ''))(b)).join('')}
          ${sectionNavHtml(unit, sec)}
        </div>`;

      const app = document.getElementById('app');
      linkGlossary(app, unit);
      bindCardInputs(app);
      app.querySelectorAll('.composer').forEach(updateComposer);
      if (sec === 'glossary') filterGlossary();
      document.querySelector('.sec-tab.active')?.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    function sectionNavHtml(unit, sec) {
      const i = SECTION_ORDER.indexOf(sec);
      const prev = SECTION_ORDER[i - 1];
      const next = SECTION_ORDER[i + 1];
      const nextUnit = WB.units[WB.units.indexOf(unit) + 1];
      return `
        <div class="row-actions" style="justify-content: space-between; margin-top: 8px;">
          ${prev ? `<a class="btn" href="#${unit.id}/${prev}">← ${SECTION_META[prev].label}</a>` : '<a class="btn" href="#">← หน้าแรก</a>'}
          ${next ? `<a class="btn btn-primary" href="#${unit.id}/${next}">${SECTION_META[next].label} →</a>` : nextUnit ? `<a class="btn btn-primary" href="#${nextUnit.id}/reading">Unit ${nextUnit.number} →</a>` : '<a class="btn btn-primary" href="#">กลับหน้าแรก</a>'}
        </div>`;
    }

    function route() {
      closeGlossPop();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      quiz = null;
      const [uid, sec] = location.hash.replace(/^#\/?/, '').split('/');
      const unit = WB.units.find(u => u.id === uid);
      if (unit) renderUnit(unit, SECTION_ORDER.includes(sec) ? sec : 'reading');
      else renderHome();
      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', route);

    // ==========================================================
    // INIT
    // ==========================================================
    (function init() {
      let theme = 'light';
      try { theme = localStorage.getItem('vocab_app_theme') || 'light'; } catch (err) { /* ignore */ }
      applyTheme(theme);
      if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
      route();
    })();
  </script>
</body>
</html>
